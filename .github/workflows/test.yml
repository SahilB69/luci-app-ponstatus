name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox python3
      - name: Check shell syntax
        run: |
          sh -n root/usr/libexec/rpcd/ponstatus
          sh -n tests/run.sh
          sh -n install.sh
      - name: Run mock ONT regression suite
        run: tests/run.sh
