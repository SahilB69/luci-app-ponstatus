name: OpenWrt SDK build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build luci-app-ponstatus with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          ARCH: x86-64
          PACKAGES: luci-app-ponstatus
          FEEDNAME: luci-app-ponstatus
          PACKAGENAME: luci-app-ponstatus
      - name: Locate generated packages
        if: always()
        run: find bin -type f \( -name '*luci-app-ponstatus*.apk' -o -name '*luci-app-ponstatus*.ipk' \) -print 2>/dev/null || true
