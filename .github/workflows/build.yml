name: OpenWrt SDK build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build luci-app-ponstatus with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          ARCH: aarch64_cortex-a53
          TARGET: mediatek/filogic
          PACKAGES: luci-app-ponstatus
          FEEDNAME: luci-app-ponstatus
          PACKAGENAME: luci-app-ponstatus
      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PACKAGE="$(find bin -type f \( -name '*luci-app-ponstatus*.apk' -o -name '*luci-app-ponstatus*.ipk' \) -print -quit)"
          test -n "$PACKAGE"
          cp "$PACKAGE" "dist/$(basename "$PACKAGE")"
          case "$PACKAGE" in
            *.apk) cp "$PACKAGE" dist/luci-app-ponstatus.apk ;;
            *.ipk) cp "$PACKAGE" dist/luci-app-ponstatus.ipk ;;
          esac
          printf 'Built package: %s\n' "$PACKAGE"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-ponstatus-mediatek-filogic
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish tagged release asset
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: luci-app-ponstatus ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
          tag_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
          files: dist/luci-app-ponstatus.*
          overwrite_files: true
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: false
          generate_release_notes: true
